<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- App Icon Background Gradient -->
    <linearGradient id="appBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f7ff"/>
    </linearGradient>

    <!-- Blue Cover Gradient -->
    <linearGradient id="bookCoverGradApp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="bookSpineGradApp" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <linearGradient id="leftPageGradApp" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="6%" stop-color="#e2e8f0"/>
      <stop offset="25%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <linearGradient id="rightPageGradApp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="6%" stop-color="#e2e8f0"/>
      <stop offset="25%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <linearGradient id="pageThicknessGradApp" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="60%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <filter id="appIconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0284c7" flood-opacity="0.32"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Squircle Base for App Icon -->
  <rect width="512" height="512" rx="112" fill="url(#appBgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#e0f2fe" stroke-width="4"/>

  <!-- Centered Scaled Book Icon (scaled to fit nicely inside squircle) -->
  <g transform="translate(40, 48) scale(0.84)" filter="url(#appIconShadow)">
    <path d="M 256 384 C 185 362, 110 362, 48 382 C 40 384, 32 376, 32 366 L 32 178 C 32 168, 40 160, 50 158 C 112 138, 185 138, 256 160 Z" fill="url(#bookCoverGradApp)"/>
    <path d="M 256 384 C 327 362, 402 362, 464 382 C 472 384, 480 376, 480 366 L 480 178 C 480 168, 472 160, 462 158 C 400 138, 327 138, 256 160 Z" fill="url(#bookCoverGradApp)"/>
    <path d="M 242 382 Q 256 406, 270 382 L 264 410 Q 256 420, 248 410 Z" fill="url(#bookSpineGradApp)"/>

    <path d="M 54 366 C 114 346, 185 346, 256 366 L 256 376 C 185 356, 114 356, 54 376 Z" fill="url(#pageThicknessGradApp)"/>
    <path d="M 458 366 C 398 346, 327 346, 256 366 L 256 376 C 327 356, 398 356, 458 376 Z" fill="url(#pageThicknessGradApp)"/>

    <path d="M 256 166 C 188 144, 116 144, 56 164 C 48 166, 42 174, 42 182 L 42 352 C 42 360, 50 368, 58 366 C 118 346, 188 346, 256 366 Z" fill="url(#leftPageGradApp)"/>
    <path d="M 256 166 C 324 144, 396 144, 456 164 C 464 166, 470 174, 470 182 L 470 352 C 470 360, 462 368, 454 366 C 394 346, 324 346, 256 366 Z" fill="url(#rightPageGradApp)"/>

    <line x1="256" y1="166" x2="256" y2="366" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <line x1="256" y1="166" x2="256" y2="366" stroke="#cbd5e1" stroke-width="2"/>
  </g>
</svg>